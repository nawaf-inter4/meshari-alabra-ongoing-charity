services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SITE_URL
        - NEXT_PUBLIC_SITE_NAME
        - NEXT_PUBLIC_SITE_SHORT_NAME
        - NEXT_PUBLIC_ORGANIZATION_NAME
        - NEXT_PUBLIC_DEFAULT_LOCALE
        - NEXT_PUBLIC_DEFAULT_DIRECTION
        - NEXT_PUBLIC_LOGO_PATH
        - NEXT_PUBLIC_FAVICON_PATH
        - NEXT_PUBLIC_APPLE_TOUCH_ICON_PATH
        - NEXT_PUBLIC_PWA_ICON_192_PATH
        - NEXT_PUBLIC_PWA_ICON_512_PATH
        - NEXT_PUBLIC_PWA_MASKABLE_ICON_PATH
        - NEXT_PUBLIC_OG_IMAGE_PATH
        - NEXT_PUBLIC_SUPPLICATIONS_PDF_PATH
        - NEXT_PUBLIC_SEO_TITLE
        - NEXT_PUBLIC_SEO_DESCRIPTION
        - NEXT_PUBLIC_SEO_KEYWORDS
        - NEXT_PUBLIC_SOCIAL_HANDLE
        - NEXT_PUBLIC_MEMORIAL_LEGAL_NAME
        - NEXT_PUBLIC_MEMORIAL_NAME
        - NEXT_PUBLIC_MEMORIAL_ALTERNATE_NAME
        - NEXT_PUBLIC_MEMORIAL_DEATH_DATE
        - NEXT_PUBLIC_MEMORIAL_DATE_TEXT
        - NEXT_PUBLIC_HERO_DESCRIPTION
        - NEXT_PUBLIC_FOOTER_CHARITY_TEXT
        - NEXT_PUBLIC_DONATION_URL
        - NEXT_PUBLIC_QURAN_PLAYLIST_ID
        - NEXT_PUBLIC_QURAN_PLAYLIST_START_VIDEO_ID
        - NEXT_PUBLIC_FAVORITE_RECITER_PLAYLIST_ID
        - NEXT_PUBLIC_FAVORITE_RECITER_START_VIDEO_ID
        - NEXT_PUBLIC_ISLAMIC_CHANT_VIDEO_ID
        - NEXT_PUBLIC_SOCIAL_LINKS
        - NEXT_PUBLIC_FALLBACK_LATITUDE
        - NEXT_PUBLIC_FALLBACK_LONGITUDE
        - NEXT_PUBLIC_FALLBACK_CITY
        - NEXT_PUBLIC_FALLBACK_COUNTRY
        - NEXT_PUBLIC_FALLBACK_COUNTRY_CODE
        - NEXT_PUBLIC_FALLBACK_FAJR
        - NEXT_PUBLIC_FALLBACK_SUNRISE
        - NEXT_PUBLIC_FALLBACK_DHUHR
        - NEXT_PUBLIC_FALLBACK_ASR
        - NEXT_PUBLIC_FALLBACK_MAGHRIB
        - NEXT_PUBLIC_FALLBACK_ISHA
        - NEXT_PUBLIC_COLOR_BRAND
        - NEXT_PUBLIC_COLOR_ACCENT
        - NEXT_PUBLIC_COLOR_LINK
        - NEXT_PUBLIC_COLOR_BACKGROUND_DARK
        - NEXT_PUBLIC_COLOR_BACKGROUND_DARK_SECONDARY
        - NEXT_PUBLIC_COLOR_BACKGROUND_DARK_ACCENT
        - NEXT_PUBLIC_COLOR_BACKGROUND_LIGHT
        - NEXT_PUBLIC_COLOR_BACKGROUND_LIGHT_SECONDARY
        - NEXT_PUBLIC_COLOR_BACKGROUND_LIGHT_ACCENT
        - NEXT_PUBLIC_PWA_ID
        - NEXT_PUBLIC_PWA_START_URL
        - NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
