name: Sync release files to sandbox

# After Release Please merges a version bump on main, open (or update) a PR that
# copies only version/changelog files onto sandbox so humans never rebase
# main→sandbox for routine releases.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-release-to-sandbox
  cancel-in-progress: true

jobs:
  sync:
    name: Open version sync PR
    runs-on: ubuntu-latest
    # Runs when version files change on main (Release Please) or via manual
    # dispatch. Exits early when sandbox already matches.

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create or update sync branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="chore/sync-release-version-to-sandbox"
          FILES=(
            package.json
            CHANGELOG.md
            .release-please-manifest.json
          )

          VERSION="$(node -p "require('./package.json').version")"
          git fetch origin sandbox

          git checkout -B "$SYNC_BRANCH" origin/sandbox

          for file in "${FILES[@]}"; do
            git checkout origin/main -- "$file"
          done

          if git diff --cached --quiet; then
            echo "Sandbox already has the same version files as main (v${VERSION})."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync release v${VERSION} files to sandbox"

          git push -u origin "$SYNC_BRANCH" --force

          EXISTING="$(gh pr list --base sandbox --head "$SYNC_BRANCH" --state open --json number --jq 'length')"
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --base sandbox \
              --head "$SYNC_BRANCH" \
              --title "chore: sync release v${VERSION} files to sandbox" \
              --body "$(cat <<EOF
## Summary
- Copies \`package.json\`, \`CHANGELOG.md\`, and \`.release-please-manifest.json\` from \`main\` after Release Please published **v${VERSION}**.
- Does **not** rebase sandbox onto main; version files only.

## Test plan
- [ ] Confirm version in \`package.json\` matches the GitHub release
- [ ] Merge this PR; no feature code should change
EOF
)"
          else
            echo "Sync PR already open; branch updated."
          fi
