name: PR labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, sandbox]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path and type labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Ensure path/type labels exist before applying (soft-fails otherwise).
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const defs = [
              { name: "enhancement", color: "a2eeef", description: "New feature or request (feat)" },
              { name: "bug", color: "d73a4a", description: "Something isn't working (fix)" },
              { name: "documentation", color: "0075ca", description: "Improvements or additions to documentation (docs)" },
              { name: "chore", color: "fef2c0", description: "Maintenance or tooling (chore)" },
              { name: "refactor", color: "c5def5", description: "Code restructuring without behavior change (refactor)" },
              { name: "performance", color: "d4c5f9", description: "Performance improvement (perf)" },
              { name: "style", color: "f9d0c4", description: "Formatting or presentation-only changes (style)" },
              { name: "build", color: "bfdadc", description: "Build system or bundler changes (build)" },
              { name: "revert", color: "e99695", description: "Reverts a previous change (revert)" },
              { name: "ci", color: "000000", description: "CI / GitHub Actions / workflow config" },
              { name: "docs", color: "0075ca", description: "Markdown docs and docs/ site content" },
              { name: "deps", color: "0366d6", description: "Dependency lockfile or package manifest" },
              { name: "i18n", color: "5319e7", description: "Locales and translation strings" },
              { name: "quran", color: "0e8a16", description: "Quran section, API, editions, or fonts" },
              { name: "a11y", color: "b60205", description: "Accessibility (axe, reduced motion, a11y)" },
              { name: "pwa", color: "1d76db", description: "Progressive Web App / service worker / install" },
              { name: "seo", color: "fbca04", description: "SEO, sitemap, robots, OG, schema" },
              { name: "tests", color: "bfd4f2", description: "Playwright e2e or other automated tests" },
              { name: "frontend", color: "168700", description: "UI components, Next.js app routes, styles" },
              { name: "content", color: "d93f0b", description: "Stories, static content, public assets" },
              { name: "scripts", color: "e4e669", description: "Repo scripts under scripts/" },
              { name: "config", color: "c2e0c6", description: "App/site config, Next, Vercel, deploy manifests" },
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const byName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));

            for (const def of defs) {
              const found = byName.get(def.name.toLowerCase());
              if (!found) {
                await github.rest.issues.createLabel({ owner, repo, ...def });
                core.info(`Created label: ${def.name}`);
              }
            }

      - name: Label by changed paths
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true

      - name: Label by conventional PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const match = title.match(
              /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?(!)?:\s+/i
            );

            const typeToLabel = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              style: "style",
              refactor: "refactor",
              perf: "performance",
              test: "tests",
              build: "build",
              ci: "ci",
              chore: "chore",
              revert: "revert",
            };

            // Only swap exclusive type labels on title edit. Do not remove
            // path-overlapping labels (ci, tests) — path labeler owns those.
            const exclusiveTypeLabels = [
              "enhancement",
              "bug",
              "documentation",
              "chore",
              "refactor",
              "performance",
              "style",
              "build",
              "revert",
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            });
            const currentNames = current.map((l) => l.name);

            const desired = match ? typeToLabel[match[1].toLowerCase()] : null;
            const toRemove = currentNames.filter(
              (name) => exclusiveTypeLabels.includes(name) && name !== desired
            );

            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name,
              });
              core.info(`Removed type label: ${name}`);
            }

            if (desired && !currentNames.includes(desired)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [desired],
              });
              core.info(`Added type label: ${desired}`);
            } else if (!desired) {
              core.info(`No conventional type prefix in title: "${title}"`);
            }
