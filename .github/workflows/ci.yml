name: CI

on:
  push:
    branches: [main, sandbox]
  pull_request:
    branches: [main, sandbox]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # After a PR merges, GitHub fires `push` for the same SHA that `pull_request`
  # already validated. Detect that duplicate and detect trusted Release Please /
  # version-sync changes (allowlisted paths + package.json version-only +
  # release/sync commit subjects) so heavy jobs can no-op while still reporting
  # green for required checks.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
      release_only: ${{ steps.paths.outputs.release_only }}
    steps:
      - id: skip
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          do_not_skip: '["workflow_dispatch", "schedule"]'

      - name: Check out repository
        if: steps.skip.outputs.should_skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version-only changes
        id: paths
        env:
          SHOULD_SKIP: ${{ steps.skip.outputs.should_skip }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$SHOULD_SKIP" = "true" ]; then
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_only=false

          if [ "$EVENT_NAME" = "pull_request" ]; then
            left_sha="${BASE_SHA}"
            right_sha="${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            left_sha="${BEFORE_SHA}"
            right_sha="${AFTER_SHA}"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="${left_sha}...${right_sha}"

          mapfile -t files < <(git diff --name-only "$range" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_only=true
          for file in "${files[@]}"; do
            case "$file" in
              package.json|package-lock.json|CHANGELOG.md|.release-please-manifest.json) ;;
              *)
                release_only=false
                break
                ;;
            esac
          done

          # Trusted release/sync commit subjects only (all commits in the range).
          if [ "$release_only" = true ]; then
            mapfile -t subjects < <(git log --no-merges --format=%s "${left_sha}..${right_sha}" || true)
            if [ "${#subjects[@]}" -eq 0 ]; then
              release_only=false
            else
              for subject in "${subjects[@]}"; do
                case "$subject" in
                  "chore: release v"*|"chore: sync release"*) ;;
                  *)
                    release_only=false
                    break
                    ;;
                esac
              done
            fi
          fi

          # If package.json changed, require a top-level version bump and nothing else.
          if [ "$release_only" = true ]; then
            package_json_changed=false
            for file in "${files[@]}"; do
              if [ "$file" = "package.json" ]; then
                package_json_changed=true
                break
              fi
            done

            if [ "$package_json_changed" = true ]; then
              old_sha="$(git merge-base "$left_sha" "$right_sha")"
              old_pkg="$(git show "${old_sha}:package.json")"
              new_pkg="$(git show "${right_sha}:package.json")"

              old_version="$(printf '%s\n' "$old_pkg" | jq -r '.version')"
              new_version="$(printf '%s\n' "$new_pkg" | jq -r '.version')"
              old_rest="$(printf '%s\n' "$old_pkg" | jq -S 'del(.version)')"
              new_rest="$(printf '%s\n' "$new_pkg" | jq -S 'del(.version)')"

              if [ "$old_version" = "$new_version" ] || [ "$old_rest" != "$new_rest" ]; then
                echo "package.json is not a version-only change; refusing release_only short-circuit."
                echo "  old version: ${old_version}"
                echo "  new version: ${new_version}"
                release_only=false
              fi
            fi
          fi

          echo "Changed files:"
          printf ' - %s\n' "${files[@]}"
          echo "release_only=${release_only}" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    needs: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip duplicate of successful run
        if: needs.preflight.outputs.should_skip == 'true'
        run: echo "Already validated for this content — skipping dependency review."

      - name: Check out repository
        if: needs.preflight.outputs.should_skip != 'true'
        uses: actions/checkout@v7

      - name: Dependency review
        if: needs.preflight.outputs.should_skip != 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  security:
    name: Security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip duplicate of successful run
        if: needs.preflight.outputs.should_skip == 'true'
        run: echo "Already validated for this content — skipping security."

      - name: Check out repository
        if: needs.preflight.outputs.should_skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: needs.preflight.outputs.should_skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        if: needs.preflight.outputs.should_skip != 'true'
        run: npm ci --legacy-peer-deps

      - name: npm audit (fail on high/critical)
        if: needs.preflight.outputs.should_skip != 'true'
        run: npm audit --audit-level=high

      - name: Install gitleaks
        if: needs.preflight.outputs.should_skip != 'true'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        if: needs.preflight.outputs.should_skip != 'true'
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner

  quality:
    name: Lint, type-check, browser test, and build
    needs: preflight
    runs-on: ubuntu-latest
    # Full matrix needs ~30m; duplicate / version-only paths finish in seconds.
    timeout-minutes: 30

    steps:
      - name: Skip duplicate of successful run
        if: needs.preflight.outputs.should_skip == 'true'
        run: echo "Already validated for this content — skipping quality."

      - name: Version-only change — skip heavy quality
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only == 'true'
        run: |
          echo "Trusted release/sync change only (version bump + allowlisted release files)."
          echo "Full lint, type-check, e2e, and build are skipped for this SHA."

      - name: Check out repository
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npm ci --legacy-peer-deps

      - name: Lint
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npm run lint

      - name: Type-check
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npm run type-check

      - name: Install Playwright browsers
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npm run test:e2e

      - name: Build
        if: >-
          needs.preflight.outputs.should_skip != 'true'
          && needs.preflight.outputs.release_only != 'true'
        run: npm run build
